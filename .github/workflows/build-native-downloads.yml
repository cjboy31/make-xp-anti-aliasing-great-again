name: Build native downloads (private source)
run-name: native-${{ inputs.batch_id }}
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact current private Test/Beta SHA; empty for runner smoke
        type: string
        required: false
        default: ''
      source_branch:
        description: Private build branch (never moves branches or publishes)
        type: choice
        options: [test, beta]
        default: beta
      platform:
        description: Native build hosts
        type: choice
        options: [all, linux]
        default: all
      batch_id:
        description: Unique controller batch ID
        type: string
        required: true
      recipient_key:
        description: Public encryption key; the private half stays on the owner PC
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-downloads-${{ github.repository }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'cjboy31/make-xp-anti-aliasing-great-again' && github.actor == 'cjboy31'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-free runner smoke
        run: |
          set -eu
          uname -s
          python3 --version
          cmake --version | head -1
          echo 'PASS: native runner started; source-free smoke'
      - name: Validate build request
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          EXPECTED_SHA: ${{ inputs.source_commit }}
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
          BATCH_ID: ${{ inputs.batch_id }}
          TARGET: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import base64,os,re
          assert os.environ['SOURCE_BRANCH'] in ('test','beta')
          assert os.environ['TARGET'] in ('all','linux')
          assert re.fullmatch('[0-9a-f]{32}',os.environ['BATCH_ID'])
          if os.environ['EXPECTED_SHA']:
              assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_SHA'])
              assert len(base64.b64decode(os.environ['RECIPIENT_KEY'],validate=True))==32
          print('PASS: allowlisted branch/host, exact SHA, encrypted-output request')
          PY
      - name: Pinned encryption dependency wheels (runner-local only)
        if: inputs.source_commit != ''
        run: |
          set -eu
          cat > "$RUNNER_TEMP/crypto-requirements.txt" <<'PINS'
          PyNaCl==1.6.2 --hash=sha256:04316d1fc625d860b6c162fff704eb8426b1a8bcd3abacea11142cbd99a6b574 --hash=sha256:22de65bb9010a725b0dac248f353bb072969c94fa8d6b1f34b87d7953cf7bbe4 --hash=sha256:26bfcd00dcf2cf160f122186af731ae30ab120c18e8375684ec2670dccd28130 --hash=sha256:2fef529ef3ee487ad8113d287a593fa26f48ee3620d92ecc6f1d09ea38e0709b --hash=sha256:320ef68a41c87547c91a8b58903c9caa641ab01e8512ce291085b5fe2fcb7590 --hash=sha256:3bffb6d0f6becacb6526f8f42adfb5efb26337056ee0831fb9a7044d1a964444 --hash=sha256:44081faff368d6c5553ccf55322ef2819abb40e25afaec7e740f159f74813634 --hash=sha256:46065496ab748469cdd999246d17e301b2c24ae2fdf739132e580a0e94c94a87 --hash=sha256:5811c72b473b2f38f7e2a3dc4f8642e3a3e9b5e7317266e4ced1fba85cae41aa --hash=sha256:622d7b07cc5c02c666795792931b50c91f3ce3c2649762efb1ef0d5684c81594 --hash=sha256:62985f233210dee6548c223301b6c25440852e13d59a8b81490203c3227c5ba0 --hash=sha256:68be3a09455743ff9505491220b64440ced8973fe930f270c8e07ccfa25b1f9e --hash=sha256:834a43af110f743a754448463e8fd61259cd4ab5bbedcf70f9dabad1d28a394c --hash=sha256:8845c0631c0be43abdd865511c41eab235e0be69c81dc66a50911594198679b0 --hash=sha256:8a66d6fb6ae7661c58995f9c6435bda2b1e68b54b598a6a10247bfcdadac996c --hash=sha256:8b097553b380236d51ed11356c953bf8ce36a29a3e596e934ecabe76c985a577 --hash=sha256:a84bf1c20339d06dc0c85d9aea9637a24f718f375d861b2668b2f9f96fa51145 --hash=sha256:a9f9932d8d2811ce1a8ffa79dcbdf3970e7355b5c8eb0c1a881a57e7f7d96e88 --hash=sha256:bc4a36b28dd72fb4845e5d8f9760610588a96d5a51f01d84d8c6ff9849968c14 --hash=sha256:c8a231e36ec2cab018c4ad4358c386e36eede0319a0c41fed24f840b1dac59f6 --hash=sha256:c949ea47e4206af7c8f604b8278093b674f7c79ed0d4719cc836902bf4517465 --hash=sha256:d071c6a9a4c94d79eb665db4ce5cedc537faf74f2355e4d502591d850d3913c0 --hash=sha256:d29bfe37e20e015a7d8b23cfc8bd6aa7909c92a1b8f41ee416bbb3e79ef182b2 --hash=sha256:fe9847ca47d287af41e82be1dd5e23023d3c31a951da134121ab02e42ac218c9
