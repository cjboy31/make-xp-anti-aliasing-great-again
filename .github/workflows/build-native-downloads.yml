name: Build native downloads (private source)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact current private beta SHA; empty for source-free runner smoke
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: native-downloads-${{ github.repository }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'cjboy31/make-xp-anti-aliasing-great-again' && github.actor == 'cjboy31'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-free runner smoke
        run: |
          set -eu
          uname -s
          python3 --version
          cmake --version | head -1
          echo 'PASS: native runner started; source-free smoke'
      - name: Checkout exact private Beta with temporary read-only key
        if: inputs.source_commit != ''
        env:
          READ_KEY: ${{ secrets.NATIVE_SOURCE_READ_KEY }}
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          set -eu
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -n "$READ_KEY" || exit 1
          key="$RUNNER_TEMP/native-source-key"
          hosts="$RUNNER_TEMP/native-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$READ_KEY" > "$key"
          unset READ_KEY
          # Host keys come from GitHub's HTTPS metadata, not unauthenticated scan.
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 15 --max-time 90 https://api.github.com/meta > "$RUNNER_TEMP/github-meta.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); open(sys.argv[2],"w").write("".join("github.com "+k+"\n" for k in x["ssh_keys"]))' "$RUNNER_TEMP/github-meta.json" "$hosts"
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$hosts'"
          git init -q "$RUNNER_TEMP/native-source"
          cd "$RUNNER_TEMP/native-source"
          git remote add origin git@github.com:cjboy31/make-xp-anti-aliasing-great-again-source.git
          git fetch --quiet --depth=1 origin beta
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git checkout --quiet --detach FETCH_HEAD
          git remote remove origin
          echo 'PASS: exact private Beta checked out; read key removed before build'
      - name: Native Linux dependencies
        if: inputs.source_commit != ''
        run: |
          set -eu
          sudo apt-get update -qq > "$RUNNER_TEMP/dependencies.log" 2>&1
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers libssl-dev libgl-dev lua5.1 >> "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Build, test and package privately; no source log output
        if: inputs.source_commit != ''
        run: |
          set -eu
          cd "$RUNNER_TEMP/native-source"
          # The complete build/test script stays in the private source checkout.
          if ! python3 tools/build_native_download.py > "$RUNNER_TEMP/native-build.log" 2>&1; then
            python3 -c 'import json,pathlib,re,sys; t=pathlib.Path(sys.argv[1]).read_text(errors="replace"); print(json.dumps({"phase":"native-build-tests-package","status":"FAIL","httpStatus":re.findall(r"HTTP Error ([0-9]{3})",t)[-3:],"exceptionClasses":re.findall(r"^([A-Za-z.]*Error):",t,re.M)[-4:],"locations":[b+":"+n for b,n in re.findall(r"File \"[^\"]*/([^/\"]+)\", line ([0-9]+)",t)[-6:]],"compilerLocations":re.findall(r"([A-Za-z0-9_.-]+\.(?:cpp|hpp|inc|mm)):[0-9]+:[0-9]+: (?:fatal )?error:",t)[-5:]}))' "$RUNNER_TEMP/native-build.log"
            echo 'FAIL: native Linux build/tests/package; private logs not uploaded'; exit 1
          fi
          echo 'PASS: native Linux build, GPU, layer and package checks'
      - name: Independent binary-only archive gate
        if: inputs.source_commit != ''
        env:
          EXPECTED_SHA: ${{ inputs.source_commit }}
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-source'/'dist-linux'
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'checked-downloads'; out.mkdir()
          archives=list(root.glob('*.tar.gz')); assert len(archives)==1
          archive=archives[0]
          with tarfile.open(archive) as z:
              assert all(m.isfile() or m.isdir() for m in z.getmembers())
              files={m.name:z.extractfile(m).read() for m in z.getmembers() if m.isfile()}
          assert len({k.split('/')[0] for k in files})==1
          payload={k.split('/',1)[1]:v for k,v in files.items()}
          allow={'install-linux.py','install.sh','README-FIRST.txt','RELEASE-MANIFEST.json','NativeAA/support/NativeAAUpdateCheck','NativeAA/64/lin.xpl','NativeAA/README.txt','CHANGELOG.md','docs/CONTROLS.md','docs/ZINK-COMPATIBILITY.md','extras/shadows/README.txt','extras/shadows/make XP shadows great again - enhanced edition.lua','NativeAA/notices/NativeAA-MIT.txt','NativeAA/notices/SMAA-MIT.txt','NativeAA/notices/FXAA-BSD.txt','NativeAA/notices/FXAA-Intel-Apache.txt','NativeAA/notices/XPLM-SDK-license.txt','NativeAA/notices/xplane-fsr3-MIT.txt'}
          for name in payload:
              assert '..' not in pathlib.PurePosixPath(name).parts
              assert name in allow or re.fullmatch(r'NativeAA/renderer/native-aa-[0-9a-f]{12}\.so',name) or re.fullmatch(r'NativeAA/renderer/shaders/(live-smaa-[0-3]-[0-2]|fxaa-[02]|native-taa|native-depth-(1|ms)|native-motion-xp-(2d|array|history|msaa|msaa-array)|cmaa2-(edges|process|apply|args)|sharpen|image-motion)\.comp\.spv',name)
          manifest=json.loads(payload['RELEASE-MANIFEST.json']); assert manifest['sourceCommit']==os.environ['EXPECTED_SHA']
          listed=set()
          for entry in manifest['files']:
              name=entry['path']; assert name not in listed; listed.add(name)
              assert hashlib.sha256(payload[name]).hexdigest()==entry['sha256']
          assert listed==set(payload)-{'RELEASE-MANIFEST.json'}
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          (out/archive.name).write_bytes(archive.read_bytes())
          (out/'SHA256SUMS.txt').write_text(digest+'  '+archive.name+'\n')
          print('PASS:',archive.name,digest)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.source_commit != ''
        with:
          name: checked-native-aa-${{ matrix.os }}
          path: checked-downloads/*
          if-no-files-found: error
          retention-days: 3
