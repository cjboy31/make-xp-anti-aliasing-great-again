name: Vulkan SMAA prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-vulkan-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install offscreen build and validation tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Check pinned MIT shader and lookup-table sources
        run: python3 tools/verify_vendor.py
      - name: Configure and compile Vulkan prototype
        run: |
          cmake -S . -B build-vulkan -G Ninja -DNATIVE_AA_BUILD_VULKAN_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vulkan --parallel 2
      - name: Check synthetic images under Lavapipe with synchronization validation
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          test -f "$VK_ICD_FILENAMES"
          export VK_LOADER_LAYERS_DISABLE='~implicit~'
          ctest --test-dir build-vulkan --output-on-failure
          python3 tools/render_evidence.py build-vulkan/gpu-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-smaa-synthetic-evidence
          path: |
            build-vulkan/gpu-evidence
            build-vulkan/Testing/Temporary/LastTest.log
